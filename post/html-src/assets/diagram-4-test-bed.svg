<svg role="img" aria-label="Diagram: the proof of concept as built. The client interface ran the tenant runners and the agent. ZITADEL Cloud was Tenant B's identity provider. A DigitalOcean droplet ran Caddy, the shim, LiteLLM and Postgres. A RunPod pod ran vLLM serving one model on an RTX 4090." xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" font-family="Helvetica Neue, Helvetica, Arial, sans-serif"><defs><marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1F2933"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5B6B63"/></marker></defs><rect width="1200" height="620" fill="#FFFFFF"/><rect x="42" y="43" width="300" height="96" rx="8" fill="#000000" opacity="0.08"/><rect x="40" y="40" width="300" height="96" rx="8" fill="#FFFFFF" stroke="#2B3A33" stroke-width="1.6"/><text x="62" y="82" font-size="24" font-weight="bold" fill="#1F2933" text-anchor="start">ZITADEL Cloud</text><text x="62" y="114" font-size="19" fill="#5B6B63" text-anchor="start">Tenant B's identity provider</text><rect x="40" y="220" width="300" height="330" rx="14" fill="#F6F8F7" stroke="#9FB0A8" stroke-width="2" stroke-dasharray="8 6"/><text x="62" y="262" font-size="24" font-weight="bold" fill="#1F2933" text-anchor="start">Client interface</text><rect x="62" y="286" width="256" height="62" rx="8" fill="#FFFFFF" stroke="#2B3A33" stroke-width="1.6"/><text x="80" y="325" font-size="21" font-weight="bold" fill="#1F2933" text-anchor="start">Tenant A runner</text><rect x="62" y="360" width="256" height="62" rx="8" fill="#FFFFFF" stroke="#2B3A33" stroke-width="1.6"/><text x="80" y="399" font-size="21" font-weight="bold" fill="#1F2933" text-anchor="start">Tenant B runner</text><rect x="62" y="434" width="256" height="62" rx="8" fill="#FFFFFF" stroke="#2B3A33" stroke-width="1.6"/><text x="80" y="473" font-size="21" font-weight="bold" fill="#1F2933" text-anchor="start">Agent, for Tenant B</text><rect x="460" y="120" width="340" height="400" rx="16" fill="#EAF4EC" stroke="#1E8E4E" stroke-width="2"/><text x="482" y="162" font-size="24" font-weight="bold" fill="#1F2933" text-anchor="start">DigitalOcean droplet</text><text x="482" y="190" font-size="19" fill="#5B6B63" text-anchor="start">the gateway</text><rect x="482" y="210" width="296" height="62" rx="8" fill="#FFFFFF" stroke="#2B3A33" stroke-width="1.6"/><text x="498" y="249" font-size="21" font-weight="bold" fill="#1F2933" text-anchor="start">Caddy: TLS, /v1 only</text><rect x="482" y="284" width="296" height="62" rx="8" fill="#FFFFFF" stroke="#2B3A33" stroke-width="1.6"/><text x="498" y="323" font-size="21" font-weight="bold" fill="#1F2933" text-anchor="start">Shim: principal, salt, audit</text><rect x="482" y="358" width="296" height="62" rx="8" fill="#FFFFFF" stroke="#2B3A33" stroke-width="1.6"/><text x="498" y="397" font-size="21" font-weight="bold" fill="#1F2933" text-anchor="start">LiteLLM: keys, budgets</text><rect x="482" y="432" width="296" height="62" rx="8" fill="#FFFFFF" stroke="#2B3A33" stroke-width="1.6"/><text x="498" y="471" font-size="21" font-weight="bold" fill="#1F2933" text-anchor="start">Postgres</text><rect x="920" y="220" width="240" height="220" rx="14" fill="#EEF4FD" stroke="#8DB4E8" stroke-width="2" stroke-dasharray="8 6"/><text x="942" y="262" font-size="24" font-weight="bold" fill="#1F2933" text-anchor="start">RunPod pod</text><text x="942" y="290" font-size="19" fill="#5B6B63" text-anchor="start">RTX 4090</text><rect x="942" y="310" width="196" height="52" rx="8" fill="#FFFFFF" stroke="#2B3A33" stroke-width="1.6"/><text x="958" y="343" font-size="20" font-weight="bold" fill="#1F2933" text-anchor="start">vLLM 0.10.2</text><rect x="942" y="372" width="196" height="52" rx="8" fill="#FFFFFF" stroke="#2B3A33" stroke-width="1.6"/><text x="956" y="405" font-size="18" font-weight="bold" fill="#1F2933" text-a