ill="#FFFFFF" stroke="#2B3A33" stroke-width="1.6"/><text x="1004" y="118" font-size="21" font-weight="bold" fill="#1F2933" text-anchor="start">Document Q&amp;A</text><text x="1004" y="146" font-size="17" fill="#5B6B63" text-anchor="start">Qwen2.5-Coder-7B</text><rect x="992" y="193" width="190" height="84" rx="8" fill="#000000" opacity="0.08"/><rect x="990" y="190" width="190" height="84" rx="8" fill="#FFFFFF" stroke="#2B3A33" stroke-width="1.6"/><text x="1004" y="222" font-size="21" font-weight="bold" fill="#1F2933" text-anchor="start">Tool calling</text><text x="1004" y="250" font-size="17" fill="#5B6B63" text-anchor="start">gpt-oss-20b</text><rect x="992" y="297" width="190" height="84" rx="8" fill="#000000" opacity="0.08"/><rect x="990" y="294" width="190" height="84" rx="8" fill="#FFFFFF" stroke="#2B3A33" stroke-width="1.6"/><text x="1004" y="326" font-size="21" font-weight="bold" fill="#1F2933" text-anchor="start">Text2SQL</text><text x="1004" y="354" font-size="17" fill="#5B6B63" text-anchor="start">Qwen2.5-Coder-7B</text><path d="M860,206 L990,206" fill="none" stroke="#1F2933" stroke-width="2.4" marker-end="url(#ak)"/><text x="925" y="190" font-size="18" fill="#5B6B63" text-anchor="middle" stroke="#FFFFFF" stroke-width="6" paint-order="stroke" stroke-linejoin="round">routed call</text><path d="M990,296 L860,296" fill="none" stroke="#5B6B63" stroke-width="2.2" stroke-dasharray="5 6" stroke-linecap="round" marker-end="url(#ag)"/><text x="925" y="322" font-size="18" fill="#5B6B63" text-anchor="middle" stroke="#FFFFFF" stroke-width="6" paint-order="stroke" stroke-linejoin="round">completion</text><text x="925" y="344" font-size="18" fill="#5B6B63" text-anchor="middle" stroke="#FFFFFF" stroke-width="6" paint-order="stroke" stroke-linejoin="round">+ usage</text><rect x="292" y="623" width="220" height="84" rx="8" fill="#000000" opacity="0.08"/><rect x="290" y="620" width="220" height="84" rx="8" fill="#FFFFFF" stroke="#2B3A33" stroke-width="1.6"/><text x="306" y="