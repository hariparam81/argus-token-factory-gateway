<svg role="img" aria-label="Data flow diagram: tenant applications, users and agents enter by one of four identity paths; the gateway authenticates, resolves the principal, applies guardrails, routes with automatic model selection and fallback, meters and stamps the call; model endpoints serve it; completions and usage return; the gateway validates federated tokens with the tenant identity provider, looks tenants up in the registry, writes spend and audit rows to the metering record, and the record is read back as tenant reports." xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 860" font-family="Helvetica Neue, Helvetica, Arial, sans-serif"><defs><marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1F2933"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5B6B63"/></marker></defs><rect width="1200" height="860" fill="#FFFFFF"/><text x="30" y="50" font-size="22" font-weight="bold" fill="#5B6B63" text-anchor="start">Callers</text><text x="290" y="50" font-size="22" font-weight="bold" fill="#5B6B63" text-anchor="start">Entry paths</text><text x="600" y="50" font-size="22" font-weight="bold" fill="#5B6B63" text-anchor="start">Factory gateway</text><text x="978" y="50" font-size="22" font-weight="bold" fill="#5B6B63" text-anchor="start">Model endpoints</text><rect x="32" y="83" width="210" height="84" rx="8" fill="#000000" opacity="0.08"/><rect x="30" y="80" width="210" height="84" rx="8" fill="#FFFFFF" stroke="#2B3A33" stroke-width="1.6"/><rect x="47" y="110" width="28" height="24" rx="4" fill="none" stroke="#12703A" stroke-width="2.4"/><path d="M47,118 H75" stroke="#12703A" stroke-width="2.4"/><circle cx="53" cy="114" r="1.6" fill="#12703A"/><text x="90" y="129" font-size="22" font-weight="bold" fill="#1F2933" text-anchor="start">Tenant app</text><rect x="32" y="187" width="210" height="84" rx="8" fill="#000000" opacity="0.08"/><rect x="30" y="184" width="210" height="84" rx="8" fill="#FFFFFF" stroke="#2B3A33" stroke-width="1.6"/><circle cx="61" cy="220" r="7" fill="#12703A"/><path d="M48,240 Q61,221 74,240 Z" fill="#12703A"/><text x="90" y="233" font-size="22" font-weight="bold" fill="#1F2933" text-anchor="start">User</text><rect x="32" y="291" width="210" height="84" rx="8" fill="#000000" opacity="0.08"/><rect x="30" y="288" width="210" height="84" rx="8" fill="#FFFFFF" stroke="#2B3A33" stroke-width="1.6"/><rect x="49" y="323" width="24" height="18" rx="5" fill="none" stroke="#12703A" stroke-width="2.4"/><circle cx="57" cy="332" r="2.4" fill="#12703A"/><circle cx="65" cy="332" r="2.4" fill="#12703A"/><path d="M61,323 V317" stroke="#12703A" stroke-width="2.4"/><circle cx="61" cy="317" r="2.2" fill="#12703A"/><text x="90" y="326" font-size="22" font-weight="bold" fill="#1F2933" text-anchor="start">Agent</text><text x="90" y="351" font-size="17" fill="#5B6B63" text-anchor="start">acts for the user</text><rect x="292" y="83" width="220" height="64" rx="8" fill="#000000" opacity="0.08"/><rect x="290" y="80" width="220" height="64" rx="8" fill="#FFFFFF" stroke="#2B3A33" stroke-width="1.6"/><text x="400" y="120" font-size="21" font-weight="bold" fill="#1F2933" text-anchor="middle">Factory key</text><rect x="292" y="167" width="220" height="64" rx="8" fill="#000000" opacity="0.08"/><rect x="290" y="164" width="220" height="64" rx="8" fill="#FFFFFF" stroke="#2B3A33" stroke-width="1.6"/><text x="400" y="204" font-size="21" font-weight="bold" fill="#1F2933" text-anchor="middle">Federated token</text><rect x="292" y="251" width="220" height="64" rx="8" fill="#000000" opacity="0.08"/><rect x="290" y="248" width="220" height="64" rx="8" fill="#FFFFFF" stroke="#2B3A33" stroke-width="1.6"/><text x="400" y="288" font-size="21" font-weight="bold" fill="#1F2933" text-anchor="middle">Delegated agent</text><rect x="292" y="335" width="220" height="64" rx="8" fill="#000000" opacity="0.08"/><rect x="290" y="332" width="220" height="64" rx="8" fill="#FFFFFF" stroke="#2B3A33" stroke-width="1.6"/><text x="400" y="372" font-size="21" font-weight="bold" fill="#1F2933" text-anchor="middle">Trial credential</text><path d="M240,122 L290,112" fill="none" stroke="#1F2933" stroke-width="2.4" marker-end="url(#ak)"/><path d="M240,226 L290,196" fill="none" stroke="#1F2933" stroke-width="2.4" marker-end="url(#ak)"/><path d="M240,330 L290,280" fill="none" stroke="#1F2933" stroke-width="2.4" marker-end="url(#ak)"/><rect x="600" y="80" width="260" height="460" rx="14" fill="#EAF4EC" stroke="#1E8E4E" stroke-width="2"/><rect x="620" y="104" width="220" height="56" rx="8" fill="#FFFFFF" stroke="#2B3A33" stroke-width="1.6"/><circle cx="645" cy="132" r="14" fill="#1E8E4E"/><text x="645" y="138" font-size="17" font-weight="bold" fill="#FFFFFF" text-anchor="middle">1</text><text x="670" y="139" font-size="19" font-weight="bold" fill="#1F2933" text-anchor="start">Authenticate</text><rect x="620" y="170" width="220" height="56" rx="8" fill="#FFFFFF" stroke="#2B3A33" stroke-width="1.6"/><circle cx="645" cy="198" r="14" fill="#1E8E4E"/><text x="645" y="204" font-size="17" font-weight="bold" fill="#FFFFFF" text-anchor="middle">2</text><text x="670" y="205" font-size="19" font-weight="bold" fill="#1F2933" text-anchor="start">Resolve principal</text><rect x="620" y="236" width="220" height="56" rx="8" fill="#FFFFFF" stroke="#5B6B63" stroke-width="1.6" stroke-dasharray="6 5"/><circle cx="645" cy="264" r="14" fill="#1E8E4E"/><text x="645" y="270" font-size="17" font-weight="bold" fill="#FFFFFF" text-anchor="middle">3</text><text x="670" y="261" font-size="19" font-weight="bold" fill="#1F2933" text-anchor="start">Guardrails</text><text x="670" y="282" font-size="16" fill="#5B6B63" text-anchor="start">PII + policy checks</text><rect x="620" y="302" width="220" height="56" rx="8" fill="#FFFFFF" stroke="#2B3A33" stroke-width="1.6"/><circle cx="645" cy="330" r="14" f